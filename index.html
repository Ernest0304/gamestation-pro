<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06b6d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GameStation Pro — 电竞甜品店计费系统</title>
  <link rel="stylesheet" href="css/style.css?v=9">
  <link rel="stylesheet" href="css/pos.css?v=9">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line>
        <circle cx="15" cy="13" r="1"></circle><circle cx="18" cy="11" r="1"></circle>
        <rect x="2" y="6" width="20" height="12" rx="3"></rect>
      </svg>
      <span>Game<span class="brand-accent">Station</span> Pro</span>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-link active" data-view="pos"><span class="nav-cn">🍽️ 点单</span><small class="nav-en">POS</small></a>
      <a href="#" class="nav-link" data-view="dashboard"><span class="nav-cn">🎮 游戏台</span><small class="nav-en">Gaming</small></a>
      <a href="#" class="nav-link" data-view="orders"><span class="nav-cn">📋 订单</span><small class="nav-en">Orders</small></a>
      <a href="#" class="nav-link" data-view="menu"><span class="nav-cn">📖 菜单</span><small class="nav-en">Menu</small></a>
      <a href="#" class="nav-link" data-view="members"><span class="nav-cn">👥 会员</span><small class="nav-en">Members</small></a>
      <a href="#" class="nav-link" data-view="history"><span class="nav-cn">📊 报表</span><small class="nav-en">Reports</small></a>
      <a href="#" class="nav-link" data-view="settings"><span class="nav-cn">⚙️</span><small class="nav-en">Set</small></a>
    </div>
  </nav>

  <main id="main-content" class="main-content">
    <div class="login-page">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-spinner"></div>
          <p class="login-subtitle">加载中...</p>
        </div>
      </div>
    </div>
  </main>
  <div id="modal" class="modal"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <!-- Report generation -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script src="js/supabase-config.js?v=9"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/auth.js?v=9"></script>
  <script src="js/dashboard.js?v=9"></script>
  <script src="js/history.js?v=9"></script>
  <script src="js/members.js?v=9"></script>
  <script src="js/settings.js?v=9"></script>
  <script src="js/pos.js?v=9"></script>
  <script src="js/menu.js?v=9"></script>
  <script src="js/orders.js?v=9"></script>
  <script src="js/app.js?v=9"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
