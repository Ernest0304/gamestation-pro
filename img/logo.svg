<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgRed" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a01828"/>
      <stop offset="100%" stop-color="#7a0818"/>
    </radialGradient>
    <path id="bottomArc" d="M 32 138 A 92 92 0 0 0 208 138" fill="none"/>
  </defs>

  <!-- White outer ring -->
  <circle cx="120" cy="120" r="115" fill="#ffffff"/>
  <!-- Red main disc -->
  <circle cx="120" cy="120" r="108" fill="url(#bgRed)"/>
  <!-- Thin inner ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Top text: 郁 (left) -->
  <text x="78" y="58" font-family="'STKaiti', 'Songti SC', 'SimSun', serif"
        font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">郁</text>

  <!-- Lotus / floral icon between 郁 and 潭 -->
  <g transform="translate(120, 46)" fill="#ffffff" opacity="0.95">
    <!-- 3 petals -->
    <ellipse cx="0" cy="2" rx="3.5" ry="8" transform="rotate(-25 0 2)"/>
    <ellipse cx="0" cy="0" rx="3.5" ry="9"/>
    <ellipse cx="0" cy="2" rx="3.5" ry="8" transform="rotate(25 0 2)"/>
    <circle cx="0" cy="3" r="2.2" fill="#fbbf24"/>
  </g>

  <!-- Top text: 潭 (right) -->
  <text x="162" y="58" font-family="'STKaiti', 'Songti SC', 'SimSun', serif"
        font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">潭</text>

  <!-- Center white circle for 香 -->
  <circle cx="120" cy="118" r="52" fill="#ffffff"/>

  <!-- 香 character (large, the brand mark) -->
  <text x="120" y="138" font-family="'STKaiti', 'Songti SC', 'SimSun', serif"
        font-size="62" font-weight="700" fill="#7a0818" text-anchor="middle">香</text>

  <!-- 甜品 small under 香 (inside white circle) -->
  <text x="120" y="158" font-family="'STKaiti', 'Songti SC', serif"
        font-size="10" font-weight="600" fill="#7a0818" text-anchor="middle"
        letter-spacing="1.5">甜  品</text>

  <!-- "Dessert" cursive below white circle, on red -->
  <text x="120" y="186" font-family="'Brush Script MT', 'Snell Roundhand', cursive"
        font-size="16" fill="#ffffff" text-anchor="middle" font-style="italic">Dessert</text>

  <!-- Bottom arc text -->
  <text font-family="serif" font-size="9.5" fill="#ffffff" letter-spacing="3" font-weight="600">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      YUU XIANG DAM · 郁香潭
    </textPath>
  </text>

  <!-- Tiny decorative dots flanking bottom text -->
  <circle cx="38" cy="138" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="202" cy="138" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
