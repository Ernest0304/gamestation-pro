<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgRed" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a01828"/>
      <stop offset="100%" stop-color="#7a0818"/>
    </radialGradient>
  </defs>

  <!-- Disc + rings -->
  <circle cx="120" cy="120" r="115" fill="#ffffff"/>
  <circle cx="120" cy="120" r="108" fill="url(#bgRed)"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Top: 郁  ✻  潭 — bigger so it reads at 120px screen size -->
  <text x="74" y="54" font-family="serif" font-size="22" font-weight="900"
        fill="#ffffff" text-anchor="middle">郁</text>
  <text x="166" y="54" font-family="serif" font-size="22" font-weight="900"
        fill="#ffffff" text-anchor="middle">潭</text>

  <!-- Lotus motif — larger, mirror-symmetric, no sub-pixel parts -->
  <g transform="translate(120, 44)">
    <!-- 5 petals in a fan -->
    <ellipse cx="-9" cy="3" rx="2.5" ry="6" transform="rotate(-30 -9 3)" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="-4.5" cy="1" rx="2.5" ry="7" transform="rotate(-12 -4.5 1)" fill="#ffffff"/>
    <ellipse cx="0" cy="0" rx="2.5" ry="8" fill="#ffffff"/>
    <ellipse cx="4.5" cy="1" rx="2.5" ry="7" transform="rotate(12 4.5 1)" fill="#ffffff"/>
    <ellipse cx="9" cy="3" rx="2.5" ry="6" transform="rotate(30 9 3)" fill="#ffffff" opacity="0.9"/>
    <!-- Golden center -->
    <circle cx="0" cy="3" r="2.4" fill="#fbbf24"/>
  </g>

  <!-- White ribbon banner for "Dessert" — slightly bigger, with subtle shadow -->
  <g>
    <path d="M 60 64 L 180 64 L 188 74 L 180 84 L 60 84 L 52 74 Z"
          fill="#ffffff"
          stroke="rgba(122,8,24,0.25)" stroke-width="0.5"/>
    <!-- Generic cursive fallback: italic serif works on every OS -->
    <text x="120" y="80" font-family="cursive, 'Brush Script MT', serif"
          font-size="20" fill="#7a0818" text-anchor="middle"
          font-style="italic" font-weight="700">Dessert</text>
  </g>

  <!-- Center white circle for 香 — slightly lower so spacing balances -->
  <circle cx="120" cy="138" r="48" fill="#ffffff"/>
  <!-- Subtle gold inner ring to add premium accent -->
  <circle cx="120" cy="138" r="45" fill="none" stroke="#fbbf24" stroke-width="0.7" opacity="0.5"/>

  <!-- 香 — strong, large, generic serif (works on all OSes for CJK) -->
  <text x="120" y="160" font-family="serif" font-size="58" font-weight="900"
        fill="#7a0818" text-anchor="middle">香</text>

  <!-- 甜品 — much bigger so it's actually readable -->
  <text x="120" y="180" font-family="serif" font-size="14" font-weight="700"
        fill="#7a0818" text-anchor="middle" letter-spacing="1.5">甜品</text>

  <!-- Bottom: brand name as ONE line (no microscopic arc text).
       Sized to actually read at 120px display. -->
  <text x="120" y="208" font-family="serif" font-size="13" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">郁香潭</text>
  <text x="120" y="224" font-family="serif" font-size="9" font-weight="500"
        fill="#ffffff" text-anchor="middle" letter-spacing="2.5"
        opacity="0.85">YUU XIANG DAM</text>
</svg>
