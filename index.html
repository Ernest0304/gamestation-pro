    <div class="nav-links">
      <a href="#" class="nav-link active" data-view="pos"><span class="nav-cn">🍽️ 点单</span><small class="nav-en">POS</small></a>

  <script src="js/app.js?v=27"></script>

  <script>
    // We removed the service worker due to stale-cache issues. For users
    // who already have an old SW installed, register the new self-destruct
    // SW which unregisters itself on activate. Subsequent visits will have
    // no SW at all, just normal HTTP caching (cleaner + always-fresh on deploy).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        if (regs.length > 0) {
          // Old SW present — install the self-destruct one to clean up.
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        // If no SW present, do nothing. App runs purely network-based.
      }).catch(() => {});
    }
  </script>
