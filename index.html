  <!-- Tabler outline icon webfont — self-hosted (Tier 0.6: POS must not
       depend on a CDN; a network blip used to blank every icon) -->

  <!-- JetBrains Mono for tabular-aligned $ figures. Kept on Google Fonts:
       the --mono stack falls back to local SF Mono/Menlo offline, so this
       degrades gracefully instead of breaking. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=51">
  <link rel="stylesheet" href="css/pos.css?v=51">
  <link rel="manifest" href="manifest.json">
  <!-- Favicon: official YUU XIANG DAM circle mark (PNG, regenerated 2026-06-23) -->

  <link rel="icon" href="/img/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon-180.png">
</head>
<body>

  <nav class="navbar">

      <div class="nav-brand-text">
        <span class="nav-brand-zh">郁香潭</span>
        <span class="nav-brand-en">Yuu Xiang Dam</span>
      </div>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-link active" data-view="pos"><span class="nav-cn">🍽️ 点单</span><small class="nav-en">POS</small></a>
      <a href="#" class="nav-link" data-view="dashboard"><span class="nav-cn">🎮 游戏台</span><small class="nav-en">Gaming</small></a>
      <a href="#" class="nav-link" data-view="orders"><span class="nav-cn">📋 订单</span><small class="nav-en">Orders</small></a>
      <a href="#" class="nav-link" data-view="menu"><span class="nav-cn">📖 菜单</span><small class="nav-en">Menu</small></a>
      <a href="#" class="nav-link" data-view="members"><span class="nav-cn">👥 会员</span><small class="nav-en">Members</small></a>

  <main id="main-content" class="main-content">

      <div class="login-card">
        <div class="login-brand">
          <div class="login-spinner"></div>
          <p class="login-subtitle">加载中...</p>
        </div>
      </div>
    </div>

  <div id="modal" class="modal"></div>

  <!-- All third-party libs self-hosted under /vendor (Tier 0.6, 2026-07-03).
       Before: 5 CDN <script> tags meant a jsDelivr outage or flaky wifi
       bricked the whole register. Pinned versions live in the repo now;
       upgrade = re-download into /vendor. -->
  <script src="/vendor/supabase.min.js?v=51"></script>
  <script src="/vendor/chart.umd.min.js?v=51"></script>
  <script src="/vendor/jspdf.umd.min.js?v=51"></script>
  <script src="/vendor/jspdf.plugin.autotable.min.js?v=51"></script>
  <script src="/vendor/xlsx.full.min.js?v=51"></script>

  <script src="js/supabase-config.js?v=51"></script>
  <script src="js/store.js?v=51"></script>
  <script src="js/auth.js?v=51"></script>
  <script src="js/dashboard.js?v=51"></script>
  <script src="js/history.js?v=51"></script>
  <script src="js/members.js?v=51"></script>
  <script src="js/settings.js?v=51"></script>
  <script src="js/pos.js?v=51"></script>
  <script src="js/menu.js?v=51"></script>
  <script src="js/orders.js?v=51"></script>
  <script src="js/admin.js?v=51"></script>
  <script src="js/app.js?v=51"></script>

  <script>
    // We removed the service worker due to stale-cache issues. For users
    // who already have an old SW installed, register the new self-destruct
    // SW which unregisters itself on activate. Subsequent visits will have
    // no SW at all, just normal HTTP caching (cleaner + always-fresh on deploy).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        if (regs.length > 0) {
          // Old SW present — install the self-destruct one to clean up.
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        // If no SW present, do nothing. App runs purely network-based.
      }).catch(() => {});
    }
  </script>
</body>
</html>
